<!-- 
  TODO: Create a motivational post website.
Style it how ever you like. 
Open the solution.html file with Live Server for inspiration. (if using the image I provided, change its height to 450px)
It must have the following features:
1. The main h1 text should be using the Regular Libre Baskerville Font from Google Fonts:
  https://fonts.google.com/specimen/Libre+Baskerville
2. The text should be white and background black.
3. Add your own image into the images folder inside assets. It should have a 5px white border.
4. The text should be center aligned.
5. Create a div to contain the h1, p and img elements. Adjust the margins so that the image and text are centered on the page. 
  Hint: You horizontally center a div by giving it a width of 50% and a margin-left of 25%.
  Hint: Set the image to have a width of 100% so it fills the div. 
6. Read about the text-transform property on MDN docs to make the h1 uppercase with CSS.
  https://developer.mozilla.org/en-US/docs/Web/CSS/text-transform 
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motivational Post</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Libre Baskerville', serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

   
    .content {
      width: 50%;
      margin-left: 25%;
      margin-top: 50px;
    }

    .motivation-img {
      width: 100%;
      height: 450px;
      object-fit: cover;
      border: 5px solid white;
    }

    
    h1 {
      text-transform: uppercase;
      font-weight: normal;
      margin: 20px 0 10px;
    }

   
    p {
      font-size: 1.2em;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="content">
    <img src="https://brightdrops.com/wp-content/uploads/2016/10/zig-ziglar-money-wont.jpg" alt="Motivational Image" class="motivation-img">
    <h1>Push That Pen To Make Papers!!!!</h1>
    <p>Get that Money, get that cash, get that dinero.
       Who else gonna give you the life you desevere.</p>
  </div>
</body>
</html>
