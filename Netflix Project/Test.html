<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>图片滑动展示</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    .carousel-container {
      position: relative;
      width: 80%;
      margin: 50px auto;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
      scroll-behavior: smooth;
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
    }

    .carousel-track::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .carousel-item {
      min-width: 300px;
      margin-right: 10px;
    }

    .carousel-item img {
      width: 100%;
      border-radius: 10px;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 20px;
      z-index: 1;
    }

    .left-btn {
      left: 10px;
    }

    .right-btn {
      right: 10px;
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <button class="carousel-btn left-btn" onclick="scrollCarousel(-1)">‹</button>
    <div class="carousel-track" id="carousel">
      <div class="carousel-item"><img src="https://via.placeholder.com/300x200?text=1"></div>
      <div class="carousel-item"><img src="https://via.placeholder.com/300x200?text=2"></div>
      <div class="carousel-item"><img src="https://via.placeholder.com/300x200?text=3"></div>
      <div class="carousel-item"><img src="https://via.placeholder.com/300x200?text=4"></div>
      <div class="carousel-item"><img src="https://via.placeholder.com/300x200?text=5"></div>
    </div>
    <button class="carousel-btn right-btn" onclick="scrollCarousel(1)">›</button>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const itemWidth = 310; // 图片宽度 + margin

    function scrollCarousel(direction) {
      carousel.scrollBy({
        left: direction * itemWidth,
        behavior: 'smooth'
      });
    }
  </script>

</body>
</html>
