<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Properties</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Edu+QLD+Hand:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      background-color: cornflowerblue;
      color: white;
      font-size: 18px;
    }

    /* Don't change the CSS above, add Your CSS below. No inline css */

    /*1. Change the color of <p>Color</p> to "coral" color.*/
    #color {
      color: coral;
    }
    /* 2. Change the font size of <p>Font Size</p> to to 2X the size of the root (html) element. */
    #size {
      font-size: 3rem;
    }
    /* 3. Change the font weight of <p>Font Weight</p> to 900. */
    #weight {
      font-weight: 900;
    }
    /* 4. Change the font family of <p>Font Family</p> to the Google font Caveat with regular (400) font weight.
     Link: https://fonts.google.com/specimen/Caveat */
    #Family {
      font-family: "Alfa Slab One", Arial;
    }

    /* 5. Change the <p>Text Align</p> to right align. */
    #align {
      text-align: right;
    }
  </style>

  <body>
    <h1>Important CSS Properties</h1>
    1. Change the color of
    <p>Color</p>
    to "coral" color.
    <p id="color">Color</p>
    <p id="Size">Font Size</p>
    <p id="weight">Font Weight</p>
    <p id="Family">Font Family</p>
    <p id="align">Text Align</p>

</html>
